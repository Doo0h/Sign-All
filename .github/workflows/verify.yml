name: Verify Sign-All
on:
  push:
    branches: [main, backend, ai, frontend, sign-data]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: node --test --test-concurrency=1
        working-directory: backend
      - run: python backend/test/document-parser.test.py
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test -- --test-concurrency=1
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: node backend/scripts/smoke.js http://127.0.0.1:8080
      - run: python backend/test/deployment-smoke.py http://127.0.0.1:8080
      - if: always()
        run: docker compose down
