# Optional server overlay: docker compose -f compose.yaml -f compose.https.yaml up -d --build
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your real DNS name}
      TEAM_USER: ${TEAM_USER:?Set TEAM_USER}
      TEAM_PASSWORD_HASH: ${TEAM_PASSWORD_HASH:?Generate a Caddy password hash interactively}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
