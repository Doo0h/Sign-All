name: signall
services:
  backend:
    build:
      context: ${BACKEND_CONTEXT:-.}
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 100
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      APP_MODE: ${APP_MODE:-demo}
      REFERENCE_MODE: live
      REFERENCE_DATA_PATH: /app/data/reference-starter.json
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080},http://127.0.0.1:8080
      TRUST_PROXY: "true"
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      MAX_AI_CONCURRENT: 1
      MAX_AI_CALLS_PER_HOUR: 30
      AI_TIMEOUT_MS: 60000
      RATE_LIMIT_PER_MINUTE: 120
    volumes:
      - reference-db:/app/backend/var
      - ${REFERENCE_DATA_FILE:-./data/reference-starter.json}:/app/data/reference-starter.json:ro
    tmpfs: [/tmp:size=32m,mode=1777]
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-.}
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 50
    environment:
      HOST: 0.0.0.0
      BACKEND_URL: http://backend:3001
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:5173
    depends_on:
      backend:
        condition: service_healthy
volumes:
  reference-db:
